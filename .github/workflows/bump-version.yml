name: Bump version after merge

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# A rerun of the same PR must not race itself. Different PRs use optimistic
# push/retry below, so GitHub concurrency cannot discard queued merge events.
concurrency:
  group: version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # This privileged workflow only executes code already merged into main.
      # Never check out the PR head or interpolate PR titles/bodies into shell.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check whether the merged PR changed firmware
        id: firmware
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          changed=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" |
            python3 firmware/scripts/firmware_changes.py)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Increment patch version and push
        if: steps.firmware.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in {1..10}; do
            git fetch origin main
            git reset --hard origin/main
            python3 firmware/scripts/bump_version.py --pr "$PR_NUMBER"
            git add VERSION firmware/functiongenerator_esp32/functiongenerator_esp32.ino firmware/functiongenerator_web/src/main.cpp
            if git diff --cached --quiet; then
              exit 0
            fi
            # Bot pushes using GITHUB_TOKEN do not trigger the push checks.
            python3 -m unittest discover -s firmware/tests -v
            node --test firmware/functiongenerator_web/tests/*.cjs
            git commit -m "chore: bump version after PR #${PR_NUMBER}"
            if git push origin HEAD:main; then
              exit 0
            fi
            # A concurrent merge/bump may have advanced main. Recompute from it.
            sleep "$attempt"
          done
          echo "Unable to push version bump after 10 attempts" >&2
          exit 1
