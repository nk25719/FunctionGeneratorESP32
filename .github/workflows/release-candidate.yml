name: Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Build and package release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Candidates must be built from main."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Install PlatformIO
        run: python3 -m pip install platformio==6.1.18

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'

      - name: Install verified ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.3

      - name: Run Python tests
        run: |
          python3 -m unittest discover \
            -s firmware/tests -v

      - name: Run firmware regression tests
        run: |
          node --test \
            firmware/functiongenerator_web/tests/*.cjs

      - name: Compile all firmware targets
        run: |
          bash firmware/scripts/build_release.sh \
            dist/release-build

      - name: Package release candidate
        run: |
          python3 firmware/scripts/package_release.py \
            --build-dir dist/release-build \
            --output dist/candidates \
            --candidate "$GITHUB_RUN_NUMBER" \
            --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload release candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/candidates/*.zip
            dist/candidates/*.zip.sha256
          if-no-files-found: error
          retention-days: 90
