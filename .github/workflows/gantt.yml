name: Generate GitHub Issues Gantt

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, field_added, field_removed]
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: issue-gantt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Generate Mermaid Gantt from issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/generate_gantt.py
      - name: Commit chart when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GANTT.md
          if git diff --cached --quiet; then
            echo "No chart changes."
            exit 0
          fi
          git commit -m "docs: refresh GitHub issue Gantt [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep "$attempt"
          done
          echo "Could not publish Gantt chart; check branch rules and Actions write permissions." >&2
          exit 1
